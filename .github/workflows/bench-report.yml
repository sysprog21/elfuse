# Publish benchmark changes from an unprivileged pull_request run. This file
# must live on the default branch for workflow_run to grant its scoped token.
name: Benchmark PR report

on:
  workflow_run:
    workflows: [Benchmark]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    name: Comment on benchmark changes
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # One report job at a time per branch, so two runs for one pull request
    # (marked ready twice) cannot both find no comment and both create one. A
    # run whose jobs were all skipped changes no comment and gets a group of its
    # own, since a third job queued in a group replaces the pending one.
    concurrency:
      group: >-
        bench-report-${{ github.event.workflow_run.conclusion == 'skipped'
        && format('skipped-{0}', github.run_id)
        || format('{0}-{1}', github.event.workflow_run.head_repository.full_name,
        github.event.workflow_run.head_branch) }}
      cancel-in-progress: false
    steps:
      - name: Find benchmark report artifact
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              }
            );
            const report = artifacts.find(
              artifact => artifact.name === 'bench-pr-report' && !artifact.expired
            );
            if (report && report.size_in_bytes > 128 * 1024) {
              core.setFailed(`Benchmark report artifact is unexpectedly large: ${report.size_in_bytes} bytes`);
              core.setOutput('found', false);
              return;
            }
            core.setOutput('found', report !== undefined);

      # The reporter comes from the default branch and the threshold from the
      # BENCH_REGRESSION_THRESHOLD repository variable; the artifact supplies
      # only the measured values.
      - name: Checkout trusted reporter and baseline
        if: ${{ steps.artifact.outputs.found == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download benchmark report
        if: ${{ steps.artifact.outputs.found == 'true' }}
        uses: actions/download-artifact@v7
        with:
          name: bench-pr-report
          path: ${{ runner.temp }}/bench-pr-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render benchmark comment
        if: ${{ steps.artifact.outputs.found == 'true' }}
        id: render
        env:
          COMMENT_PATH: ${{ runner.temp }}/bench-comment.md
          REPORT_PATH: ${{ runner.temp }}/bench-pr-report/bench-pr-report.json
          BENCH_REGRESSION_THRESHOLD: ${{ vars.BENCH_REGRESSION_THRESHOLD }}
        run: |
          set -euo pipefail
          status=$(python3 scripts/bench-report.py \
            --report "$REPORT_PATH" --output "$COMMENT_PATH" \
            --environment elfuse-aarch64)
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # Runs on a clean report too: a pull request marked ready again after a
      # return to draft or given the bench label is measured again, and an
      # earlier comment listing changes has to be rewritten when that run finds
      # none. For the same reason a failed run with no report rewrites an
      # earlier comment to say that commit was not measured. A run whose jobs
      # were all skipped (a draft, or a label other than bench) is not one.
      - name: Create or update benchmark comment
        if: >-
          ${{ steps.render.outcome == 'success' ||
          (steps.artifact.outputs.found == 'false' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.conclusion != 'skipped') }}
        uses: actions/github-script@v9
        env:
          COMMENT_PATH: ${{ runner.temp }}/bench-comment.md
          REPORT_FOUND: ${{ steps.artifact.outputs.found }}
          REPORT_STATUS: ${{ steps.render.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- elfuse-benchmark-report -->';
            const run = context.payload.workflow_run;
            const runHead = run.head_sha;
            const headRepository = run.head_repository;
            const headOwner = headRepository && headRepository.owner && headRepository.owner.login;
            const headBranch = run.head_branch;
            if (typeof runHead !== 'string' || !/^[0-9a-f]{40}$/i.test(runHead)) {
              core.setFailed('The workflow run has no valid head SHA');
              return;
            }
            if (typeof headOwner !== 'string' || !headOwner ||
                typeof headBranch !== 'string' || !headBranch ||
                !headRepository.full_name) {
              core.setFailed('The workflow run has no valid head repository/ref');
              return;
            }

            // workflow_run.pull_requests is empty for fork runs in this repo.
            // Resolve the PR from trusted workflow-run identity fields. A run
            // whose head has moved on still reports, naming the commit it
            // measured, because a push to a pull request starts no run.
            const candidates = await github.paginate(
              github.rest.pulls.list,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                base: context.payload.repository.default_branch,
                head: `${headOwner}:${headBranch}`,
                per_page: 100,
              }
            );
            const matches = candidates.filter(pull =>
              pull.head && pull.head.repo &&
              pull.head.repo.full_name === headRepository.full_name
            );
            if (matches.length !== 1) {
              core.notice(`Expected one current pull request for ${headRepository.full_name}:${headBranch}@${runHead}, got ${matches.length}`);
              return;
            }
            const pullNumber = matches[0].number;

            const {data: pull} = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });
            const moved = pull.head.sha !== runHead
              ? ` (the pull request has moved on to \`${pull.head.sha.slice(0, 12)}\`, which is not measured)`
              : '';

            const found = process.env.REPORT_FOUND === 'true';
            const text = found
              ? fs.readFileSync(process.env.COMMENT_PATH, 'utf8').trim()
              : 'The benchmark did not complete at this commit, so it has no measurements.';
            // Neither a clean report nor a missing one is worth a new comment,
            // unless the pull request holds the bench label: someone asked
            // for the run, and the workflow_run payload does not say which
            // action (labeled, opened or ready_for_review) started it.
            const asked = (pull.labels || []).some(label => label.name === 'bench');
            const quiet = !asked &&
              (!found || process.env.REPORT_STATUS === 'clean');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${run.id}`;
            // The pull_request run measured the merge ref of its event, which
            // is when the run was created.
            const refTime = run.created_at;
            // Only a cancelled run without a report leaves out the ref time,
            // so its comment keeps out no report: a run replaced while
            // pending (the bench label added again) is cancelled before the
            // run ahead of it reports. A failed run's comment keeps it, so
            // the report of an earlier merge ref cannot replace that failure.
            const stamp = found || run.conclusion !== 'cancelled'
              ? `<!-- elfuse-benchmark-ref-time: ${refTime} -->\n` : '';
            const body = `${marker}\n${stamp}${text}\n\n[Workflow run](${runUrl}) · commit \`${runHead.slice(0, 12)}\`${moved}\n`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                per_page: 100,
              }
            );
            const previous = comments.find(comment =>
              comment.user && comment.user.login === 'github-actions[bot]' &&
              typeof comment.body === 'string' && comment.body.includes(marker)
            );

            if (quiet && !previous) {
              return;
            }
            // A maintainer's pr dispatch or a later bench label run may have
            // reported a later merge ref before this run finished; its report
            // stays.
            const prevTime = previous &&
              (previous.body.match(/<!-- elfuse-benchmark-ref-time: (\S+) -->/) || [])[1];
            if (prevTime && prevTime > refTime) {
              core.notice(`Comment ${previous.id} reports a merge ref from ${prevTime}`);
              return;
            }
            if (previous) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previous.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullNumber,
                body,
              });
            }
