# Formatting and static checks on a fast Linux runner.
#
# All sub-checks run even if an earlier one fails so the report shows every
# problem at once instead of stopping at the first.
name: Lint

# No path filter, deliberately, and the only workflow without one. Two things
# lean on that. proof-scope.py's self-test has to run somewhere a path filter
# cannot skip, or the mechanism that decides which proofs run could skip its
# own gate. check-skill-refs.py validates the .md files under .claude/, whose
# entire input domain the old '**.md' ignore excluded and which build.yml and
# static-analysis.yml both list as inert, so a documentation-only pull request
# would otherwise run no CI at all, including the check written for exactly
# that file.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # A merge queue runs the merged result, not the PR, and merge_group carries
  # no path filter and no pull_request payload: every check runs in full there.
  # Without this trigger a queue would merge with nothing having run at all.
  merge_group:

# Cancel in-progress runs for the same PR; keep main runs going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint: formatting + static analysis on a fast Linux runner.
  lint:
    name: Lint (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Single source of truth for the apt package list. Used by both the
      # cache key (so unrelated workflow edits don't bust the cache) and
      # the install step.
      LINT_PKGS: clang-format-22 cppcheck shellcheck
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The checks needing nothing from LINT_PKGS run first; only clang-format,
      # shellcheck and cppcheck want it. That ordering buys an earlier
      # annotation rather than runner minutes, since a failing run still pays
      # for the install: what skips the install is the content check further
      # down, not an earlier failure.
      #
      # Every step from here on carries "if: !cancelled()", the setup steps
      # included, because the job's contract at the top of this file is that
      # one failure does not hide the rest. A default-conditioned setup step
      # would be skipped by the first pre-apt failure, and the three
      # tool-dependent checks would then report a missing binary instead of
      # reporting on the code.
      - name: Trailing newline
        if: ${{ !cancelled() }}
        run: .ci/check-newline.sh

      - name: Banned APIs / secrets / unsafe pp directives
        if: ${{ !cancelled() }}
        run: .ci/check-security.sh

      - name: Source character set
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check-ascii.py --self-test
          python3 scripts/check-ascii.py

      - name: Syscall dispatch table consistency
        # The generator validates dispatch.tbl <-> syscall.c on every run;
        # writing to a throwaway path is enough to exercise validate_wrappers().
        if: ${{ !cancelled() }}
        run: python3 scripts/gen-syscall-dispatch.py --output "$RUNNER_TEMP/dispatch.h"

      - name: Proof target consistency
        # Three lists name the same proved sources: mk/verify.mk's targets,
        # the verify-mutants matrix in verify.yml, and src/proved/. A target
        # in one but not another either drops that target's mutation coverage
        # from CI with no error, or leaves an unproved header sitting in a
        # directory whose name claims it is proved.
        if: ${{ !cancelled() }}
        run: python3 scripts/check-proof-targets.py

      - name: Proof scope self-test
        # verify.yml builds its matrix from proof-scope.py's answer to "which
        # proof targets can this diff reach", so that answer decides whether a
        # proof runs at all. It rests on a hand-kept HARNESS_FILES list and on
        # include closures, both of which rot quietly. It runs here because
        # lint.yml is never narrowed, so the check cannot be skipped by the
        # mechanism it checks.
        #
        # The one step before the apt install that needs a binary: the closures
        # come from "cc -MM", and cc is the runner image's preinstalled gcc,
        # not a LINT_PKGS entry. An image without one fails this step loudly
        # ("cannot determine proof-input closures") rather than scoping on a
        # scan it could not run, so the assumption announces itself. Installing
        # a compiler here instead would put this check behind the apt step and
        # cost it the fast failure.
        if: ${{ !cancelled() }}
        run: python3 scripts/proof-scope.py --self-test

      - name: Commit messages
        # CONTRIBUTING.md's "Git Commit Style" section states seven rules and
        # said continuous integration enforced them. Nothing did: the hooks
        # under scripts/ are opt-in, so a contributor who never ran
        # "make install-hooks" was gated by a sentence. This is that gate.
        #
        # Pull requests only. A push to main carries commits that already came
        # through one, and the merge queue re-validating them would only find
        # what this already rejected.
        #
        # The checkout is shallow, so both ends of the range have to be
        # fetched, and a range whose walk runs into the shallow boundary comes
        # back wrong rather than failing: rev-list exits 0 having listed
        # whatever it could reach. Both directions happen, and neither is
        # acceptable, so both are guarded below. Depth is generous because
        # merge commits inside a pull request make the walk deeper than the
        # commit count alone.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          COUNT: ${{ github.event.pull_request.commits }}
        run: |
          set -euo pipefail
          : "${COUNT:?the pull_request payload carries no commit count}"
          depth=$((COUNT * 2 + 50))
          git fetch --no-tags --depth="$depth" origin "$HEAD"
          # The same depth for the base, not 1. Fetched at depth 1 the base has
          # no known ancestry, so "$BASE..$HEAD" excludes the base commit and
          # nothing else: everything below the fork point stays in the range.
          # The moment the base branch moves past the point the pull request
          # forked from, which is the ordinary case, a two-commit pull request
          # comes back as the whole fetched slice and the gate judges the
          # project's history against today's rules.
          git fetch --no-tags --depth="$depth" origin "$BASE"
          # This is what catches that, and the count comparison cannot: a range
          # truncated at the base end comes back longer than the pull request,
          # not shorter. merge-base fails exactly when the boundary leaves the
          # two ends with no common ancestor to compute the range from.
          if ! git merge-base "$BASE" "$HEAD" > /dev/null; then
            echo "::error::No common ancestor for this pull request's base and" \
                 "head; the shallow boundary truncated the range. Raise the depth."
            exit 1
          fi
          # And this catches the head end. A surplus past the guard above is not
          # this check's business: the range and GitHub's count are derived
          # differently, and the direction that means "some commits went
          # unchecked" is fewer.
          found=$(git rev-list --count "$BASE..$HEAD")
          if [ "$found" -lt "$COUNT" ]; then
            echo "::error::Reached $found of this pull request's $COUNT commits;" \
                 "the shallow boundary truncated the range. Raise the fetch depth."
            exit 1
          fi
          git rev-list --no-merges "$BASE..$HEAD" | scripts/check-commit-log.sh

      - name: Git hook self-test
        # The hooks and this job's commit-message gate are the same script, so
        # a rule that regresses regresses in both places at once. Every case in
        # the test was a live defect: a rejected merge subject leaves a merge
        # half-finished, and a "git commit -v" message linted against its own
        # appended diff fails on width for reasons the author cannot see.
        if: ${{ !cancelled() }}
        run: scripts/test-git-hooks.sh

      - name: Skill cross-references
        # The .claude/ skills cite files, make targets and sections by name.
        # Nothing else notices when one is renamed, and a skill that points at
        # a file which no longer exists is worse than no skill: it reads as
        # current. This found two dead references to a workflow and a makefile
        # that the CI split had already removed.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check-skill-refs.py --self-test
          python3 scripts/check-skill-refs.py

      - name: Atomic spelling
        # Reads src/ and the .claude/ skills, nothing built, so it belongs in
        # the lane with no path filter. The documentation half in particular:
        # build.yml ignores '**.md' and '.claude/**', so the pull request this
        # half was written for is exactly the one that reaches no `make check`.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check-atomics.py --self-test
          python3 scripts/check-atomics.py

      - name: Store-buffering handshakes
        # Lexical over src/, nothing built: a store then a load of another
        # location, mirrored elsewhere, without seq_cst on both sides.
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/check-sb-handshake.py --self-test
          python3 scripts/check-sb-handshake.py

      # What follows needs LINT_PKGS, and the three checks that use it read
      # only C sources, the style file, and the .ci scripts that implement
      # them. cppcheck alone is 50 of this job's 85 seconds and the install is
      # another 12, so a pull request touching none of those would otherwise
      # pay about 70 seconds for three checks with nothing to look at.
      # The checks above still run on everything, which is what lets this
      # workflow carry no path filter at all.
      #
      # Whenever the answer is not certain (a push, a merge queue, a base that
      # cannot be fetched) every check runs. A skipped check here is one whose
      # inputs are unchanged, never one whose result is unknown.
      - name: Which inputs changed
        id: changed
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          run_everything() {
            echo "c=true" >> "$GITHUB_OUTPUT"
            echo "sh=true" >> "$GITHUB_OUTPUT"
            echo "cf=true" >> "$GITHUB_OUTPUT"
            echo "$1; running every check"
            exit 0
          }
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            run_everything "no pull_request base to diff against"
          fi
          if ! git fetch --no-tags --depth=1 origin "$base"; then
            run_everything "cannot fetch $base"
          fi
          # -z, or git renders a non-ASCII path as a quoted C string under
          # core.quotePath and the anchored patterns below stop matching it.
          # A path that stops matching skips a check, which is the direction
          # this step must not fail in, so the diff failing takes the same
          # way out as a failed fetch.
          if ! files=$(git diff --name-only -z "$base" HEAD | tr '\0' '\n'); then
            run_everything "cannot diff against $base"
          fi
          # "c" is not "a .c or .h file changed", it is "an input to
          # clang-format or cppcheck changed", and those two read more than
          # the sources: .clang-format is the style clang-format enforces,
          # .ci/ holds the scripts that ARE the checks, and check-cppcheck.sh
          # regenerates build/dispatch.h from dispatch.tbl through the
          # generator before it analyzes anything. A pull request editing only
          # one of those would otherwise change a check without running it.
          c=false; sh=false; cf=false
          pat='\.(c|h)$|^\.clang-format$|^\.ci/|^src/syscall/dispatch\.tbl$'
          pat="$pat"'|^scripts/gen-syscall-dispatch\.py$'
          # commentflow reads a wider set than clang-format: it reflows shell
          # and assembly too, and it takes its column limit from .clang-format,
          # so a change to that file moves every comment in the tree.
          cfpat='\.(c|h|s|S|sh|bash)$|^\.clang-format$'
          # This workflow pins both formatters, commentflow by checksum below
          # and clang-format through LINT_PKGS, so editing it can change what
          # either gate enforces. Re-checking the tree is the only way that
          # shows up before the next contributor hits it, so both patterns
          # carry the workflow itself.
          selfpat='|^\.github/workflows/lint\.yml$'
          cfpat="$cfpat$selfpat"
          pat="$pat$selfpat"
          # A here-string, not a pipeline into grep. Under pipefail a "grep -q"
          # that matches early exits while the writer still has bytes to push,
          # the writer takes SIGPIPE, and the pipeline reports non-zero even
          # though the pattern MATCHED -- so the check would read as "unchanged"
          # and skip. .ci/check-security.sh carries the same trap at length.
          # It needs a diff long enough to fill the pipe buffer, which is
          # exactly the diff that must not skip a check.
          if grep -qE "$pat" <<< "$files"; then c=true; fi
          if grep -qE '^(\.ci|scripts)/.*\.sh$' <<< "$files"; then sh=true; fi
          if grep -qE "$cfpat" <<< "$files"; then cf=true; fi
          echo "c=$c" >> "$GITHUB_OUTPUT"
          echo "sh=$sh" >> "$GITHUB_OUTPUT"
          echo "cf=$cf" >> "$GITHUB_OUTPUT"
          echo "C sources changed: $c; .ci shell changed: $sh; reflow inputs changed: $cf"

      # commentflow ships as a release binary rather than an apt package, and
      # its only tag is a rolling "latest", so the asset moves under a fixed
      # URL. The bytes are checked against the sha256 GitHub records for the
      # asset itself, read from the API in the same step that downloads it,
      # rather than a copy of that hash kept here. A hash written into this
      # file has to be recomputed by hand on every upstream republish, and it
      # fails as two hex strings that differ, which says nothing about what
      # moved.
      #
      # What this does and does not buy: it detects a truncated or tampered
      # transfer, since the digest comes from the API rather than the CDN path
      # the tarball travels. It does not freeze the version, so a republished
      # "latest" is picked up silently. Comment reflow is a formatting gate, so
      # the failure mode is a diff in the reflow check rather than a wrong
      # binary running against the tree, and that diff is what surfaces the
      # change.
      - name: Install commentflow
        id: install_commentflow
        if: ${{ !cancelled() && steps.changed.outputs.cf == 'true' }}
        env:
          COMMENTFLOW_REPO: sysprog21/commentflow
          COMMENTFLOW_ASSET: commentflow-x86_64-unknown-linux-gnu.tar.gz
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta=$(gh api "repos/$COMMENTFLOW_REPO/releases/tags/latest")

          # An absent digest means the release predates the field. A download
          # nothing verifies is not worth having, so stop rather than skip the
          # check.
          digest=$(jq -r --arg n "$COMMENTFLOW_ASSET" \
            '.assets[] | select(.name == $n) | .digest // ""' <<< "$meta")
          url=$(jq -r --arg n "$COMMENTFLOW_ASSET" \
            '.assets[] | select(.name == $n) | .browser_download_url // ""' \
            <<< "$meta")
          if [ -z "$digest" ] || [ -z "$url" ]; then
            echo "no digest or download URL recorded for $COMMENTFLOW_ASSET" >&2
            exit 1
          fi

          curl -fsSL -o /tmp/commentflow.tar.gz "$url"
          echo "${digest#sha256:}  /tmp/commentflow.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/commentflow.tar.gz -C /usr/local/bin commentflow

      # Gated on the install having succeeded, not merely on the job not being
      # cancelled. Every other check here runs under !cancelled() so one
      # failure does not hide the rest, but this one has a dependency rather
      # than a peer: with a bare !cancelled() a failed download or a stale
      # checksum reaches this step as "commentflow not found", which reads as a
      # missing tool on the runner instead of the pin that actually broke.
      - name: Comment reflow
        if: ${{ !cancelled() && steps.changed.outputs.cf == 'true' && steps.install_commentflow.outcome == 'success' }}
        run: .ci/check-commentflow.sh

      - name: Cache apt packages
        if: ${{ !cancelled() && (steps.changed.outputs.c == 'true' || steps.changed.outputs.sh == 'true') }}
        uses: actions/cache@v6
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-${{ env.LINT_PKGS }}

      - name: Add LLVM apt repo (clang-format-22)
        if: ${{ !cancelled() && (steps.changed.outputs.c == 'true' || steps.changed.outputs.sh == 'true') }}
        # Place the key in /etc/apt/keyrings and bind it via signed-by so
        # it grants trust only to the LLVM repository, not system-wide.
        run: |
          set -euo pipefail
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/llvm.asc] http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list

      - name: Install tools
        if: ${{ !cancelled() && (steps.changed.outputs.c == 'true' || steps.changed.outputs.sh == 'true') }}
        run: |
          set -euo pipefail
          mkdir -p ~/apt-cache
          # A mirror outage can outlast apt's own retries, so retry the whole
          # step.
          n=0
          # shellcheck disable=SC2086 -- LINT_PKGS is a space-separated list.
          until sudo apt-get update &&
            sudo apt-get install -y -o Dir::Cache::Archives="$HOME/apt-cache" \
              $LINT_PKGS; do
            n=$((n + 1))
            [ "$n" -lt 3 ] || exit 1
            sleep 20
          done

      - name: clang-format
        if: ${{ !cancelled() && steps.changed.outputs.c == 'true' }}
        run: .ci/check-format.sh

      - name: shellcheck
        # Scoped to .ci/ and scripts/ -- tests/ has pre-existing warnings that
        # the repository's own check-format target already surfaces. scripts/
        # is here because the git hooks live there and a hook that aborts on
        # its own shell is worse than no hook: it teaches contributors to pass
        # --no-verify, which costs the checks that do work.
        if: ${{ !cancelled() && steps.changed.outputs.sh == 'true' }}
        run: |
          set -euo pipefail
          mapfile -d '' files < <(git ls-files -z -- '.ci/*.sh' 'scripts/*.sh')
          shellcheck --severity=warning "${files[@]}"

      - name: cppcheck
        if: ${{ !cancelled() && steps.changed.outputs.c == 'true' }}
        run: .ci/check-cppcheck.sh
