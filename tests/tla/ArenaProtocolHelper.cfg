\* ArenaProtocol.cfg plus one host-only thread that faults guest memory in
\* (the GDB stub's guest_write), which can hold a gate reference across a
\* dirty-block memset while execve runs. MaxGen = 1 keeps the run complete.
SPECIFICATION Spec
CONSTANTS
    V = {v1, v2}
    Helpers = {h1}
    NoOne = NoOne
    NPages = 3
    ArenaPages = 2
    MaxGen = 1
    PubRing = 1
    RetRing = 2
    FlushArenaOnReuse = TRUE
    ModelTLB = FALSE
CONSTRAINT GenBound
INVARIANTS
    NoFailClosed
    NoStalePte
    GateExclusion
    GateAccounting
