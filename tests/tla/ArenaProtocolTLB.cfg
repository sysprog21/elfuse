\* ArenaProtocol.cfg with TLB entries tracked: a host writer's TLBI runs only
\* when that vCPU returns to EL0, after mmap_lock is released. MaxGen = 1
\* keeps the larger state space checkable.
SPECIFICATION Spec
CONSTANTS
    V = {v1, v2}
    Helpers = {}
    NoOne = NoOne
    NPages = 3
    ArenaPages = 2
    MaxGen = 1
    PubRing = 1
    RetRing = 2
    FlushArenaOnReuse = TRUE
    ModelTLB = TRUE
CONSTRAINT GenBound
INVARIANTS
    NoFailClosed
    NoStalePte
    GateExclusion
    GateAccounting
