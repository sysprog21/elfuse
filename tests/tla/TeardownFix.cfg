\* Teardown.cfg with the fix: the loop top parks at the barrier when back at
\* EL0, and the fork raises shim attention before kicking so an EL1 window
\* leaves through HVC #5. Kicks may still be lost and both resumes stay.
SPECIFICATION Spec
CONSTANTS
    Leader = L
    Workers = {w1, w2}
    None = None
    KickLatched = FALSE
    El1Escape = TRUE
    SignalEscape = TRUE
    LoopTopBarrier = TRUE
    ForkAttention = TRUE
INVARIANTS
    QuietSnapshot
    NoOverlap
    CountSane
